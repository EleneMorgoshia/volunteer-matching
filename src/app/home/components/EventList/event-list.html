<div>
  <div class="card-container">
    @for (item of tmpArr(); track $index) {
      <div class="card">
        <app-event-card
          [eventItem]="item"
          [canEdit]="canEdit()"
          (eventDeleted)="eventDeleted.emit()"
        ></app-event-card>
      </div>
    }
  </div>
  <app-pagination
    [currentPage]="currentPage()"
    [totalItems]="events()?.length || 0"
    (pageChanged)="onPageChange($event)"
  ></app-pagination>
</div>
