<div>
  <div class="card-container">
    @for (item of tmpArr; track $index) {
      <div class="card">
        <app-event-card [id]="item"></app-event-card>
      </div>
    }
  </div>
  <app-pagination
    [currentPage]="currentPage"
    [totalItems]="allCards.length"
    (pageChanged)="onPageChange($event)"
  ></app-pagination>
</div>
