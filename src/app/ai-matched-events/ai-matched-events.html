<section class="ai-matched-section">
  <div class="section-header">
    <h1>დამთხვევული ღონისძიებები</h1>
  </div>

  @if (matchedEvents$ | async; as eventDetails) {
    <app-event-list
      [events]="eventDetails"
      [isMatchVolunteer]="matchService.authService.isVolunteer()"
      (requestMatch)="onRequestMatch($event)"
      (rejectMatch)="onRejectMatch($event)"
    ></app-event-list>
  } @else {
    <div class="empty-state">
      <mat-icon fontIcon="auto_awesome"></mat-icon>
      <h2>დამთხვევული ღონისძიებები ჯერ არ არის</h2>
      <p>AI დამთხვევის შემდეგ აქ გამოჩნდება თქვენზე მორგებული ღონისძიებები.</p>
    </div>
  }
</section>
