@if (profileInfo !== null) {
  <div class="profile-card">
    <h2>Organization Profile</h2>

    <p><strong>Name:</strong> {{ profileInfo.organizationName }}</p>
    <p><strong>Email:</strong> {{ profileInfo.email }}</p>
    <p><strong>Description:</strong> {{ profileInfo.description }}</p>
  </div>
} @else {
  <p>Loading profile...</p>
}
