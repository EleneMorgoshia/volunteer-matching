@if (profileInfo$ | async; as profileInfo) {
  <div class="profile-card">
    <div class="priority-container">
      <div class="image-container">
        <div class="profile-placeholder">
          <mat-icon fontIcon="business">business</mat-icon>
        </div>
      </div>

      <div class="priority-content">
        <div class="profile-header">
          <h1>{{ profileInfo.organizationName }}</h1>

          <button class="edit-button" matFab (click)="onNavigateToEdit()">
            <mat-icon fontIcon="edit">edit</mat-icon>
          </button>
        </div>

        <div class="main-info-grid">
          <div class="info-row">
            <span>იმეილი:</span>
            <p>{{ profileInfo.email }}</p>
          </div>
        </div>

        <div class="section">
          <h3>ორგანიზაციის შესახებ</h3>
          <p>{{ profileInfo.description }}</p>
        </div>
      </div>
    </div>

    <div class="events-section">
      <div class="events-header">
        <h3>ორგანიზაციის მიმდინარე ივენთები</h3>

        <span class="add-event-text" routerLink="/organization/add-event">
          ივენთის დამატება
        </span>
      </div>

      <div class="events-container">
        <button class="add-event-button" matFab routerLink="/organization/add-event">
          <span>+</span>
        </button>
      </div>
    </div>
  </div>
} @else {
  <p class="loading-text">Loading profile...</p>
}
