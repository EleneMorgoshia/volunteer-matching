<form class="volunteer">
  <h1 class="form-title">რეგისტრაცია</h1>

  <div class="input-div">
    <label for="firstName">სახელი</label>
    <input
      id="firstName"
      type="text"
      placeholder="შეიყვანეთ თქვენი სახელი"
      [formField]="form.firstName"
    />
  </div>

  <div class="input-div">
    <label for="lastName">გვარი</label>
    <input
      id="lastName"
      type="text"
      placeholder="შეიყვანეთ თქვენი გვარი"
      [formField]="form.lastName"
    />
  </div>

  <div class="input-div">
    <label for="email">იმეილი</label>
    <input id="email" type="email" placeholder="შეიყვანეთ თქვენი იმეილი" [formField]="form.email" />
  </div>

  <div class="input-div">
    <label for="birthDate">დაბადების თარიღი</label>
    <input id="birthDate" type="date" (input)="birthDateString.set($any($event.target).value)" />
  </div>

  <div class="input-div">
    <label for="citizenship">მოქალაქეობა</label>
    <input
      id="citizenship"
      type="text"
      placeholder="შეიყვანეთ თქვენი მოქალაქეობა"
      [formField]="form.citizenship"
    />
  </div>

  <div class="input-div">
    <label for="languages">ენები</label>
    <input id="languages" type="text" placeholder="რა ენებს ფლობთ?" [formField]="form.languages" />
  </div>

  <div class="input-div">
    <label for="profession">პროფესია</label>
    <input
      id="profession"
      type="text"
      placeholder="რა პროფესიის ხართ?"
      [formField]="form.profession"
    />
  </div>

  <div class="input-div">
    <label for="skills">უნარები</label>
    <span class="example-label">მაგ: კომუნიკაცია, სწავლება, გრაფიკული დიზაინი...</span>
    <textarea
      id="skills"
      class="big-input"
      placeholder="ჩაწერეთ თქვენი უნარები"
      [formField]="form.skills"
    ></textarea>
  </div>

  <div class="input-div">
    <label for="interests">ინტერესები</label>
    <span class="example-label">მაგ: კითხვა, ცეკვა, იოგა, მედიტაცია...</span>
    <textarea
      id="interests"
      class="big-input"
      placeholder="ჩაწერეთ თქვენი ინტერესები"
      [formField]="form.interests"
    ></textarea>
  </div>

  <div class="input-div">
    <label>თემატიკა</label>

    <label class="checkbox-label">
      <input
        type="checkbox"
        value="3fa85f64-5717-4562-b3fc-2c963f66afa6"
        (change)="onTagChange($event)"
      />
      განათლება
    </label>
  </div>

  <div class="input-div">
    <label for="password">პაროლი</label>
    <input
      id="password"
      type="password"
      placeholder="შეიყვანეთ პაროლი"
      [formField]="form.password"
    />
  </div>

  <div class="input-div">
    <label for="confirmPassword">პაროლის დადასტურება</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="გაიმეორეთ პაროლი"
      [formField]="form.confirmPassword"
    />
  </div>

  <button class="send-btn" type="button" (click)="onSend()">რეგისტრაცია</button>
</form>
