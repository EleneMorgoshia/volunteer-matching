<div class="favourites-card-container">
  <img src="" >

  <div class="left-content-container">
    <!-- title vs X icon -->
    <div class="first-info-container">
      <div class="title-container">
        <p class="event-title">{{ eventDetails()?.eventTitle }}</p>
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="close"></mat-icon>
      </div>
     <p class="organisation-name">{{ eventDetails()?.organizationName }}</p>
    </div>


    <!-- description div -->
    <div class="description-container">
      <p>
        {{eventDetails()?.eventDescription}}
      </p>
    </div>

    <!-- detailed info div -->
    <div class="detailed-info-container">
      <!-- date info -->
      <div class="date-conatiner">
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="schedule" width="24px" height="24px"></mat-icon>
        <p>Date info</p> 
        <!-- აქ ვთხოვ რომ მთლიენი თარიღი დაწყებაც და დასრულებაც ერთ სტრინგად მომცეს არა? -->
      </div>

      <div class="location-theme-down-container">
        <!-- location info -->
        <div class="location-container">
          <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="location_on" width="24px" height="24px"></mat-icon>
          <p>{{ eventDetails()?.eventLocation }}</p>
        </div>

        <!-- theme info -->
        <div class="theme-container">
          <mat-icon
            aria-hidden="false"
            aria-label="Example home icon"
            fontIcon="auto_awesome"
            width="24px" height="24px"
          ></mat-icon>
          <p>Theme</p>
          <!-- ჯერ არ არის მოფიქრებული როგორ მოგვაწვდიან -->
        </div>
      </div>
      
    </div>


  </div>
</div>
