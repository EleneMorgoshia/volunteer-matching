<div class="event-card-conatiner">
  <!-- img and heart div -->
  <div class="image-container">
    <img src="" alt="" >
    <mat-icon class="heart-icon" aria-hidden="false" aria-label="Example home icon" fontIcon="favorite" width="24px" height="24px"></mat-icon>
  </div>

  <div class="texts-container">
    <p class="event-title">Random Event Name</p>
    <p class="organisation-name">Organisation Name</p>

    <div class="description-container">
      <p>
        Lorem, ipsum dolor sit amet 
        consectetur adipisicing elit. 
        Beatae unde dolore esse nemo
        officiis debitis. Sint, eos 
        voluptate, fugit aut est...
      </p>
    </div>
  </div>

  <!-- detailed info container -->
  <div class="detailed-info-container">
    <!--Location info-->
    <div class="location-container">
      <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="location_on" width="24px" height="24px"></mat-icon>
      <p>location info</p>
      <hr>
    </div>

    <!-- date info -->
    <div class="date-container">
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="schedule" width="24px" height="24px"></mat-icon>
        <p>date info</p>
        <hr>
    </div>

    <!--theme-->
    <div class="theme-container">
        <mat-icon
            aria-hidden="false"
            aria-label="Example home icon"
            fontIcon="auto_awesome"
            width="24px" height="24px"
        ></mat-icon>
        <p>theme info</p>
    </div>
  </div>


  <!-- აქ ზოგ შემთხვევაში buttonები ინება ზოგგან არა -->
  <div class="buttons-container">
    <button>დადასტურება</button>
    <button>უარყოფა</button>
  </div>
</div>
